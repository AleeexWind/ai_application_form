services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__Key: DevelopmentOnlyKey_ChangeInProduction_32Chars!
      Jwt__Issuer: ApplicationForm.Api
      Jwt__Audience: ApplicationForm.Client
      Frontend__Url: http://localhost:5173

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8080
    ports:
      - "5173:80"
    depends_on:
      - backend
